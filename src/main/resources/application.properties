app.storage.location=./images

spring.config.import=optional:file:.env[.properties]

spring.security.oauth2.client.registration.google.client-id=${CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email,https://www.googleapis.com/auth/calendar.events.readonly

# Redirect URL: post-login URL that spring automatically handles
# Once the redirect URL is called, Spring sends the temporary code returned by Google back
# to the Google server. In exchange, Google returns an ID token (who the user is) and an access token (what resources the user can access),
# which are used to authenticate the user's future Google Calendar requests.
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.provider=google
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Ollama configuration
spring.ai.model.chat=ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen3-vl:4b
spring.ai.ollama.chat.temperature=0.5

#Ollama prompt
calendar.extraction.prompt="From this image, give me details about a one event on Monday. Return the response in the expected format."